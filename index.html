

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Information Finder</title>

    <!-- PyScript setup -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.1.1/core.js"></script>

    <!-- CSS design -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #cbd5e1;
            text-align: center;
        }

        h1 {
            color: #4f46e5;
            font-size: 25px;
        }

        p {
            color: #475569;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        #result h3 {
            color: #4f46e5;
            text-align: center;
        }

        #result p {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            margin: 8px 0;
        }

        footer {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Element Finder</h1>
        <p>Search for a non-metal element using its symbol.</p>

        <!-- Input field -->
        <input type="text" id="symbol" placeholder="Enter symbol (e.g., H)">

        <!-- Search button -->
        <button py-click="search_element">Search Element</button>

        <!-- Result display -->
        <div id="result"></div>

        <footer>Periodic Table Information Finder</footer>
    </div>

    <!-- Python code -->
    <script type="py">
from pyscript import document

# Dictionary of element information
# Format: Symbol: (Name, Atomic Number, Atomic Mass)
nonmetals = {
    "H": ("Hydrogen", 1, 1.008),
    "He": ("Helium", 2, 4.0026),
    "C": ("Carbon", 6, 12.011),
    "N": ("Nitrogen", 7, 14.007),
    "O": ("Oxygen", 8, 15.999),
    "F": ("Fluorine", 9, 18.998),
    "Ne": ("Neon", 10, 20.180),
    "Al": ("Aluminum", 13, 26.982),
    "Si": ("Silicon", 14, 28.085),
    "P": ("Phosphorus", 15, 30.974),
    "S": ("Sulfur", 16, 32.06),
    "Cl": ("Chlorine", 17, 35.45),
    "Ar": ("Argon", 18, 39.948),
    "Se": ("Selenium", 34, 78.971),
    "Br": ("Bromine", 35, 79.904),
    "Kr": ("Krypton", 36, 83.798),
    "I": ("Iodine", 53, 126.904),
    "Xe": ("Xenon", 54, 131.293),
    "At": ("Astatine", 85, 210),
    "Rn": ("Radon", 86, 222)
}

# Function called when the button is clicked
def search_element(event):
    # Get the symbol entered by the user
    symbol = document.getElementById("symbol").value.strip().capitalize()

    # Get the element information from the dictionary
    element = nonmetals.get(
        symbol,
        ("Element not found", "N/A", "N/A")
    )

    # Get the result area
    result = document.getElementById("result")

    # Display all four required details
    result.innerHTML = (
        "<h3>Element Information</h3>"
        + "<p><b>Element Symbol:</b> " + symbol + "</p>"
        + "<p><b>Element Name:</b> " + str(element[0]) + "</p>"
        + "<p><b>Atomic Number:</b> " + str(element[1]) + "</p>"
        + "<p><b>Atomic Mass:</b> " + str(element[2]) + "</p>"
    )
    </script>
</body>
</html>
